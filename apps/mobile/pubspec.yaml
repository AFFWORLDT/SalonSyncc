name: salonkit
description: "SalonKit — the salon's own app for barbers and admins."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  get: ^4.7.3
  dio: ^5.9.1
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.4
  local_auth: ^3.0.2
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^18.0.1
  firebase_crashlytics: ^5.0.4
  connectivity_plus: ^6.1.0
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  animations: ^2.0.11
  package_info_plus: ^9.0.1
  excel: ^4.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    # Google Sans Flex (text) and Google Sans Code (numbers, ids, uppercase labels): the web app's faces, bundled (OFL).
    - family: GoogleSansFlex
      fonts:
        - asset: assets/fonts/GoogleSansFlex-400.ttf
          weight: 400
        - asset: assets/fonts/GoogleSansFlex-500.ttf
          weight: 500
        - asset: assets/fonts/GoogleSansFlex-600.ttf
          weight: 600
        - asset: assets/fonts/GoogleSansFlex-700.ttf
          weight: 700
    - family: GoogleSansCode
      fonts:
        - asset: assets/fonts/GoogleSansCode-400.ttf
          weight: 400
        - asset: assets/fonts/GoogleSansCode-500.ttf
          weight: 500
        - asset: assets/fonts/GoogleSansCode-600.ttf
          weight: 600
